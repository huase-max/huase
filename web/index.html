<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>排列五预测器</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #e74c3c;
            --primary-dark: #c0392b;
            --secondary: #3498db;
            --accent: #f39c12;
            --success: #27ae60;
            --text: #ecf0f1;
            --text-muted: #95a5a6;
            --border: rgba(255,255,255,0.08);
            --bg-card: rgba(255,255,255,0.06);
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 16px;
            --bg-primary: #0a0a1a;
            --input-bg: rgba(255,255,255,0.06);
            --input-border: var(--border);
            --tab-bg: rgba(255,255,255,0.03);
            --tab-color: var(--text-muted);
            --tab-active-bg: var(--primary);
            --tab-active-color: white;
            --custom-bar-bg: rgba(243,156,18,0.06);
            --custom-bar-border: rgba(243,156,18,0.15);
            --custom-bar-color: #c98a00;
            --status-bg: rgba(255,255,255,0.03);
            --rec-item-bg: rgba(255,255,255,0.03);
            --bao-combo-bg: rgba(255,255,255,0.03);
            --bao-combo-border: var(--border);
            --combo-item-bg: rgba(255,255,255,0.06);
            --modal-bg: rgba(26,26,46,0.95);
            --modal-border: var(--border);
            --warning-bg: rgba(243,156,18,0.08);
            --warning-border: rgba(243,156,18,0.15);
            --footer-color: var(--text-muted);
            --chart-bar-color: #3498db;
        }
        body.light-mode {
            --bg-primary: #f0f2f5;
            --text: #1a1a2e;
            --text-muted: #555;
            --border: rgba(0,0,0,0.08);
            --bg-card: rgba(255,255,255,0.7);
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
            --input-bg: rgba(255,255,255,0.6);
            --input-border: rgba(0,0,0,0.1);
            --tab-bg: rgba(255,255,255,0.3);
            --tab-color: #333;
            --tab-active-bg: var(--primary);
            --tab-active-color: white;
            --custom-bar-bg: rgba(243,156,18,0.1);
            --custom-bar-border: rgba(243,156,18,0.3);
            --custom-bar-color: #b8860b;
            --status-bg: rgba(255,255,255,0.3);
            --rec-item-bg: rgba(255,255,255,0.3);
            --bao-combo-bg: rgba(255,255,255,0.3);
            --bao-combo-border: rgba(0,0,0,0.08);
            --combo-item-bg: rgba(0,0,0,0.05);
            --modal-bg: rgba(255,255,255,0.95);
            --modal-border: rgba(0,0,0,0.1);
            --warning-bg: rgba(243,156,18,0.15);
            --warning-border: rgba(243,156,18,0.3);
            --footer-color: #555;
            --chart-bar-color: #2980b9;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
            transition: background 0.6s ease, color 0.4s ease;
        }
        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        header { text-align: center; padding: 2rem 0 1rem; }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
            text-shadow: 0 0 40px rgba(231,76,60,0.2);
        }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; letter-spacing: 0.1em; }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 0.6rem 2rem;
            border: 1px solid var(--border);
            border-radius: 50px;
            background: var(--tab-bg);
            color: var(--tab-color);
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            flex: 0 1 auto;
            min-width: 80px;
        }
        .tab-btn.active {
            background: var(--tab-active-bg);
            color: var(--tab-active-color);
            border-color: var(--tab-active-bg);
            box-shadow: 0 0 20px rgba(231,76,60,0.3);
        }
        .tab-btn:hover:not(.active) {
            background: rgba(255,255,255,0.08);
            color: var(--text);
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .control-panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: background 0.4s, border 0.4s, box-shadow 0.4s;
        }
        .controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 1 1 120px;
            min-width: 100px;
        }
        .control-group label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .input-field {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 0.5rem 0.8rem;
            color: var(--text);
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.3s ease;
            width: 100%;
            min-width: 70px;
            backdrop-filter: blur(4px);
        }
        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(231,76,60,0.15);
        }
        select.input-field { cursor: pointer; appearance: auto; }

        .btn {
            border: none;
            border-radius: 50px;
            padding: 0.5rem 1.2rem;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            white-space: nowrap;
            flex: 0 1 auto;
            min-width: 70px;
            backdrop-filter: blur(4px);
            letter-spacing: 0.03em;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn:active:not(:disabled) { transform: scale(0.96); }
        .btn-predict {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 4px 15px rgba(231,76,60,0.3);
        }
        .btn-predict:hover:not(:disabled) { box-shadow: 0 0 30px rgba(231,76,60,0.4); transform: translateY(-2px); }
        .btn-backtest {
            background: linear-gradient(135deg, var(--secondary), #1f618d);
            box-shadow: 0 4px 15px rgba(52,152,219,0.3);
        }
        .btn-backtest:hover:not(:disabled) { box-shadow: 0 0 30px rgba(52,152,219,0.4); transform: translateY(-2px); }
        .btn-quant {
            background: linear-gradient(135deg, var(--success), #1e8449);
            box-shadow: 0 4px 15px rgba(39,174,96,0.3);
        }
        .btn-quant:hover:not(:disabled) { box-shadow: 0 0 30px rgba(39,174,96,0.4); transform: translateY(-2px); }
        .btn-ai {
            background: linear-gradient(135deg, #8e44ad, #6c3483);
            box-shadow: 0 4px 15px rgba(142,68,173,0.3);
        }
        .btn-ai:hover:not(:disabled) { box-shadow: 0 0 30px rgba(142,68,173,0.4); transform: translateY(-2px); }
        .btn-train {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            box-shadow: 0 4px 15px rgba(44,62,80,0.3);
        }
        .btn-train:hover:not(:disabled) { box-shadow: 0 0 30px rgba(44,62,80,0.4); transform: translateY(-2px); }
        .btn-export {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            box-shadow: 0 4px 15px rgba(39,174,96,0.3);
        }
        .btn-export:hover:not(:disabled) { box-shadow: 0 0 30px rgba(39,174,96,0.4); transform: translateY(-2px); }
        .btn-export-img {
            background: linear-gradient(135deg, #8e44ad, #6c3483);
            box-shadow: 0 4px 15px rgba(142,68,173,0.3);
        }
        .btn-export-img:hover:not(:disabled) { box-shadow: 0 0 30px rgba(142,68,173,0.4); transform: translateY(-2px); }
        .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.7rem; border-radius: 50px; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            box-shadow: none;
        }
        .btn-outline:hover { background: rgba(243,156,18,0.15); transform: translateY(-2px); }

        .custom-bar {
            background: var(--custom-bar-bg);
            border: 1px solid var(--custom-bar-border);
            border-radius: 12px;
            padding: 0.5rem 1rem;
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            backdrop-filter: blur(4px);
        }
        .custom-bar label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--custom-bar-color);
        }
        .custom-bar input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); }
        .custom-summary { font-size: 0.75rem; color: var(--text-muted); flex: 1; min-width: 120px; word-break: break-word; }

        .status-bar {
            background: var(--status-bg);
            border-radius: 10px;
            padding: 0.4rem 0.8rem;
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-height: 36px;
            backdrop-filter: blur(4px);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .status-dot.active { background: var(--success); }
        .status-dot.error { background: var(--primary); }
        .status-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            word-break: break-word;
            line-height: 1.3;
        }

        .results { margin-top: 1.2rem; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 1.2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: background 0.4s, border 0.4s, box-shadow 0.4s, transform 0.25s;
            overflow: hidden;
            word-break: break-word;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
        .card.span-2 { grid-column: 1 / -1; }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
        }
        .card-title::before {
            content: '';
            width: 3px;
            height: 18px;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            border-radius: 3px;
            flex-shrink: 0;
        }

        .draw-numbers { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
        .number-ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 4px 20px rgba(231,76,60,0.3);
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .number-ball:hover { transform: scale(1.05); }
        .number-ball.special { background: linear-gradient(135deg, var(--accent), #d68910); box-shadow: 0 4px 20px rgba(243,156,18,0.3); }
        .draw-info { text-align: center; margin-bottom: 0.8rem; color: var(--text-muted); font-size: 0.8rem; }

        .rec-item {
            background: var(--rec-item-bg);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            border-left: 3px solid var(--primary);
            margin-bottom: 0.5rem;
            backdrop-filter: blur(4px);
        }
        .rec-label { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 0.1rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .rec-value {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            color: var(--accent);
            word-break: break-all;
        }
        .rec-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.1rem; word-break: break-word; }

        .bao-combos {
            margin-top: 0.4rem;
            max-height: 100px;
            overflow-y: auto;
            background: var(--bao-combo-bg);
            border-radius: 6px;
            padding: 0.3rem 0.5rem;
            font-family: 'Consolas', monospace;
            font-size: 0.7rem;
            line-height: 1.6;
            color: var(--text-muted);
            border: 1px solid var(--bao-combo-border);
            backdrop-filter: blur(4px);
        }
        .bao-combos::-webkit-scrollbar { width: 3px; }
        .bao-combos::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        .bao-combos .combo-item {
            display: inline-block;
            background: var(--combo-item-bg);
            padding: 0.05rem 0.4rem;
            border-radius: 3px;
            margin: 0.05rem 0.15rem;
            font-weight: 600;
            color: var(--accent);
            font-size: 0.65rem;
        }

        .budget-table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -0.5rem;
            padding: 0 0.5rem;
        }
        .budget-table {
            width: 100%;
            min-width: 580px;
            border-collapse: collapse;
            font-size: 0.72rem;
        }
        .budget-table th, .budget-table td {
            padding: 0.3rem 0.2rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            vertical-align: middle;
            word-break: break-word;
        }
        .budget-table th {
            font-size: 0.6rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .budget-table td:first-child {
            font-weight: 500;
            white-space: nowrap;
            font-size: 0.65rem;
        }
        .budget-table .play-combo {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.65rem;
            color: var(--accent);
            word-break: break-all;
            max-width: 100px;
        }
        .budget-table .highlight { color: var(--accent); font-weight: 600; }
        .budget-table .success { color: var(--success); }

        /* ===== 纯 CSS 图表样式 ===== */
        .chart-container {
            margin: 0.5rem 0;
            padding: 0.5rem;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .chart-container .chart-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }
        .chart-bar-row {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-bottom: 0.15rem;
            height: 20px;
        }
        .chart-bar-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            width: 30px;
            text-align: right;
            flex-shrink: 0;
        }
        .chart-bar-track {
            flex: 1;
            height: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            overflow: hidden;
        }
        .chart-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.6s ease;
            background: linear-gradient(90deg, var(--secondary), var(--success));
        }
        .chart-bar-value {
            font-size: 0.55rem;
            color: var(--text-muted);
            width: 28px;
            text-align: left;
            flex-shrink: 0;
        }
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.6rem;
            margin-top: 0.3rem;
        }
        .chart-legend-item {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.55rem;
            color: var(--text-muted);
        }
        .chart-legend-color {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.8rem;
        }

        .data-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
        .data-table th, .data-table td {
            padding: 0.25rem 0.3rem;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            word-break: break-word;
        }
        .data-table th { color: var(--text-muted); font-weight: 500; text-align: right; font-size: 0.65rem; }
        .data-table td:first-child, .data-table th:first-child { text-align: left; }

        .score-grid {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.65rem;
            line-height: 1.6;
            color: var(--text-muted);
            overflow-x: auto;
            white-space: nowrap;
        }
        .score-grid span { display: inline-block; width: 32px; text-align: center; font-size: 0.6rem; }

        .factor-bar {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-bottom: 0.15rem;
            flex-wrap: wrap;
        }
        .factor-name { width: 80px; font-size: 0.7rem; text-align: right; color: var(--text-muted); flex-shrink: 0; }
        .factor-bar-inner {
            flex: 1;
            height: 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            overflow: hidden;
            min-width: 50px;
        }
        .factor-bar-fill {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--secondary), var(--success));
            transition: width 0.3s;
        }
        .factor-val { width: 45px; font-size: 0.65rem; text-align: left; font-family: 'Orbitron', sans-serif; flex-shrink: 0; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--modal-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--modal-border);
            border-radius: var(--radius);
            padding: 1.5rem;
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            transition: background 0.4s, border 0.4s, box-shadow 0.4s;
        }
        .modal h3 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--text); }
        .modal-section { margin-bottom: 1rem; }
        .modal-section h4 { font-size: 0.8rem; color: var(--accent); margin-bottom: 0.4rem; }
        .modal-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
            align-items: center;
        }
        .modal-row label { font-size: 0.75rem; color: var(--text-muted); min-width: 50px; }
        .modal-row select, .modal-row input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            padding: 0.25rem 0.4rem;
            color: var(--text);
            font-size: 0.75rem;
        }
        .modal-row select { width: 45px; }
        .modal-row input { width: 140px; }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
        .play-checks { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; }
        .play-checks label {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text);
        }
        .play-checks input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent); }

        .warning {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            border-radius: 10px;
            padding: 0.6rem 1rem;
            margin-top: 1.2rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            backdrop-filter: blur(4px);
        }
        .warning-icon { font-size: 1.1rem; flex-shrink: 0; }
        .warning-text { font-size: 0.72rem; line-height: 1.4; color: var(--text-muted); }

        footer {
            text-align: center;
